name: Build CMTRY

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.x'

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCLIENT=ON -DSERVER=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload CMTRY
        uses: actions/upload-artifact@v4
        with:
          name: cmtry-windows
          path: build/Release/cmtry.exe